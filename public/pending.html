<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pembayaran Pending</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-xl rounded-2xl p-10 max-w-md w-full text-center">

        <div class="mb-6">

            <div class="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mx-auto">

                <svg xmlns="http://www.w3.org/2000/svg"
                    class="w-14 h-14 text-yellow-500"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />

                </svg>

            </div>

        </div>

        <h1 class="text-3xl font-bold text-yellow-500 mb-4">
            Menunggu Pembayaran
        </h1>

        <p class="text-gray-600 mb-6 leading-relaxed">
            Transaksi Anda berhasil dibuat dan sedang menunggu proses pembayaran.
            <br><br>
            Silakan selesaikan pembayaran sesuai metode yang dipilih.
        </p>

        <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-4 mb-6">

            <p class="text-sm text-yellow-700">
                Status transaksi:
            </p>

            <p class="font-bold text-yellow-600 text-lg">
                PENDING
            </p>

        </div>

        <a href="/"
            class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl transition">

            Kembali ke Beranda

        </a>

    </div>

</body>
</html>
