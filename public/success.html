<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pembayaran Berhasil</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-xl rounded-2xl p-10 max-w-md w-full text-center">

        <div class="mb-6">

            <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto">

                <svg xmlns="http://www.w3.org/2000/svg"
                    class="w-14 h-14 text-green-600"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M5 13l4 4L19 7" />

                </svg>

            </div>

        </div>

        <h1 class="text-3xl font-bold text-green-600 mb-4">
            Pembayaran Berhasil
        </h1>

        <p class="text-gray-600 mb-6 leading-relaxed">
            Terima kasih, pembayaran Anda telah berhasil diproses.
            <br><br>
            Pesanan akan segera kami proses.
        </p>

        <div class="bg-green-50 border border-green-200 rounded-xl p-4 mb-6">

            <p class="text-sm text-green-700">
                Status transaksi:
            </p>

            <p class="font-bold text-green-600 text-lg">
                SUCCESS / PAID
            </p>

        </div>

        <a href="/"
            class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl transition">

            Kembali ke Beranda

        </a>

    </div>

</body>
</html>
