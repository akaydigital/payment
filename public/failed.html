<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pembayaran Gagal</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-xl rounded-2xl p-10 max-w-md w-full text-center">

        <div class="mb-6">

            <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto">

                <svg xmlns="http://www.w3.org/2000/svg"
                    class="w-14 h-14 text-red-600"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M6 18L18 6M6 6l12 12" />

                </svg>

            </div>

        </div>

        <h1 class="text-3xl font-bold text-red-600 mb-4">
            Pembayaran Gagal
        </h1>

        <p class="text-gray-600 mb-6 leading-relaxed">
            Maaf, transaksi pembayaran Anda gagal diproses.
            <br><br>
            Silakan coba kembali atau gunakan metode pembayaran lainnya.
        </p>

        <div class="bg-red-50 border border-red-200 rounded-xl p-4 mb-6">

            <p class="text-sm text-red-700">
                Status transaksi:
            </p>

            <p class="font-bold text-red-600 text-lg">
                FAILED
            </p>

        </div>

        <a href="/"
            class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl transition">

            Coba Lagi

        </a>

    </div>

</body>
</html>
